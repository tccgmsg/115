<script>
    // 關鍵字搜尋與委員、陪同者、日期複選篩選功能
    const selectedFilters = {
        committee: new Set(),
        companion: new Set(),
        date: new Set()
    };

    function filterData() {
        const input = document.getElementById('searchInput').value.trim().toLowerCase();
        const cards = document.querySelectorAll('.card');

        cards.forEach(card => {
            const searchData = card.getAttribute('data-search').toLowerCase();
            const matchesKeyword = !input || searchData.includes(input);
            const matchesGroups = Object.entries(selectedFilters).every(([group, values]) => {
                return values.size === 0 || [...values].some(value => searchData.includes(value.toLowerCase()));
            });

            card.style.display = matchesKeyword && matchesGroups ? "" : "none";
        });

        const hasSelectedFilter = Object.values(selectedFilters).some(values => values.size > 0);
        document.getElementById('clearFiltersBtn').classList.toggle('active', !hasSelectedFilter && !input);
    }

    function toggleFilter(name, btn) {
        const group = btn.closest('.filter-group').dataset.filterType;
        const values = selectedFilters[group];

        if (values.has(name)) {
            values.delete(name);
            btn.classList.remove('active');
        } else {
            values.add(name);
            btn.classList.add('active');
        }

        filterData();
    }

    function clearAllFilters() {
        Object.values(selectedFilters).forEach(values => values.clear());
        document.querySelectorAll('.filter-group .filter-btn').forEach(button => button.classList.remove('active'));
        document.getElementById('searchInput').value = '';
        filterData();
    }
</script>
